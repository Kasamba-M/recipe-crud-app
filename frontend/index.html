<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Recipe Card - CRUD</title>
<style>
  body { font-family: Arial; max-width: 1000px; margin: auto; padding: 20px; background: #fafafa; }
  h1 { color: #e67e22; }
  form { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px #ccc; display: grid; gap: 10px; }
  input, textarea, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
  button { padding: 10px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background: #d35400; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
  th { background: #e67e22; color: white; }
  .actions button { margin-right: 5px; background: #3498db; }
  .actions button:last-child { background: #e74c3c; }
</style>
</head>
<body>
<h1>🍲 Personal Recipe Card</h1>

<form id="recipeForm">
  <input type="hidden" id="id">
  <input type="text" id="title" placeholder="Recipe Title * e.g. Nshima" required>
  <textarea id="ingredients" placeholder="Ingredients * e.g. Mealie meal, water" required></textarea>
  <textarea id="instructions" placeholder="Instructions * e.g. Boil water..." required></textarea>
  <input type="number" id="cooking_time" placeholder="Cooking Time in minutes (e.g. 30)">
  <select id="difficulty">
    <option value="">Select Difficulty</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>
  <input type="text" id="category" placeholder="Category e.g. Zambian, Dinner">
  <button type="submit">Save Recipe</button>
  <button type="button" onclick="resetForm()" style="background:#95a5a6">Cancel / Clear</button>
</form>

<table>
  <thead><tr><th>ID</th><th>Title</th><th>Time</th><th>Difficulty</th><th>Category</th><th>Actions</th></tr></thead>
  <tbody id="recipeTable"></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
